<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c" aria-label="Animated network graphic"></canvas>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');let n=[],e=[],t=0,lastAdd=0,lastFrame=0,audioStarted=false;
function startMusic(){if(audioStarted)return;audioStarted=true;let A=new (window.AudioContext||window.webkitAudioContext)();A.resume();let g=A.createGain(),f=A.createBiquadFilter();g.gain.value=.01;f.type='lowpass';f.frequency.value=500;g.connect(f).connect(A.destination);let o=A.createOscillator();o.type='sine';o.frequency.value=220;o.connect(g);o.start()}
addEventListener('pointerdown',startMusic,{once:true});addEventListener('keydown',startMusic,{once:true});setTimeout(startMusic,250);
function rs(){let r=c.getBoundingClientRect(),d=1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);if(!n.length)for(let i=0;i<12;i++)n.push({x:Math.random()*r.width,y:Math.random()*r.height,vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,r:i%5?.75+Math.random()*1.25:2.5+Math.random()*3,h:i==3});if(!e.length)e=[[0,1]]}
function go(now=0){requestAnimationFrame(go);if(now-lastFrame<16)return;lastFrame=now;let w=c.clientWidth,h=c.clientHeight;t+=.08;x.fillStyle='#05080d';x.fillRect(0,0,w,h);if(t-lastAdd>3&&e.length<4){let a=Math.random()*n.length|0,b=Math.random()*n.length|0;if(a!==b)e.push([a,b]);lastAdd=t}n.forEach(a=>{a.x+=a.vx+Math.sin(t+a.y*.01)*.1;a.y+=a.vy+Math.cos(t+a.x*.01)*.1;if(a.x<a.r||a.x>w-a.r)a.vx*=-1;if(a.y<a.r||a.y>h-a.r)a.vy*=-1});e.forEach((q,i)=>{let a=n[q[0]],z=n[q[1]];x.strokeStyle='#b8c6d433';x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(z.x,z.y);x.stroke();let p=(Math.sin(t+i)+1)/2;x.fillStyle='#ff5a1855';x.beginPath();x.arc(a.x+(z.x-a.x)*p,a.y+(z.y-a.y)*p,.7,0,7);x.fill()});n.forEach(a=>{let pulse=a.r+(a.h?Math.sin(t*2)*.375:Math.sin(t*2+a.x)*.0625);x.shadowBlur=a.h?4:1;x.shadowColor=a.h?'#ff4d0a':'#dbe8ff';x.fillStyle=a.h?'#ff4d0a':'#edf2f8';x.beginPath();x.arc(a.x,a.y,Math.max(.25,pulse),0,7);x.fill()})}
addEventListener('resize',rs);rs();go();
</script>
</html>
