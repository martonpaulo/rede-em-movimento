<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="application-name" content="Network in Motion">
<meta name="description" content="An ambient animated network of light, motion, and connection.">

<meta property="og:description" content="An ambient animated network of light, motion, and connection.">

<meta property="og:image:alt" content="A glowing orange and white network on a dark background.">

<link rel="apple-touch-icon" href="logo.svg">
<title>Network in Motion</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d}canvas{display:block;width:100vw;height:100vh}#audio-panel{position:fixed;left:24px;bottom:24px;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #b8c6d455;border-radius:999px;background:#0b111acc;color:#edf2f8;font:600 12px Arial,sans-serif;letter-spacing:.03em;backdrop-filter:blur(8px)}#audio-panel button{border:0;background:transparent;color:#edf2f8;font:inherit;cursor:pointer;padding:3px}#audio-panel button:hover{color:#ff9a62}#volume{width:80px;accent-color:#ff5a18;cursor:pointer}</style>
<canvas id="c" aria-label="Animated network graphic"></canvas>
<div id="audio-panel" aria-label="Audio controls"><button id="sound" type="button" aria-label="Play ambient sound">▶ Play</button><button id="mute" type="button" aria-label="Mute ambient sound">🔊</button><input id="volume" type="range" min="0" max="1" step=".01" value=".55" aria-label="Volume"></div>
<audio id="music" loop preload="auto" src="space-ambient-mix.mp3"></audio>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),soundButton=document.querySelector('#sound'),muteButton=document.querySelector('#mute'),volume=document.querySelector('#volume'),music=document.querySelector('#music');let n=[],e=[],t=0,lastAdd=0,lastFrame=0,audioStarted=false,mouseX=0,mouseY=0,dragged=null;
function startMusic(){music.volume=Number(volume.value);music.muted=false;music.load();music.play().then(()=>{audioStarted=true;soundButton.textContent='❚❚ Pause';soundButton.setAttribute('aria-label','Pause ambient sound')}).catch(()=>{soundButton.textContent='▶ Play'})}
function toggleMusic(){if(music.paused)startMusic();else{music.pause();soundButton.textContent='▶ Play';soundButton.setAttribute('aria-label','Play ambient sound')}}
soundButton.addEventListener('click',toggleMusic);muteButton.addEventListener('click',()=>{music.muted=!music.muted;muteButton.textContent=music.muted?'🔇':'🔊'});volume.addEventListener('input',()=>{music.volume=Number(volume.value);if(music.volume>0)music.muted=false});
addEventListener('pointerdown',()=>{if(!audioStarted)startMusic()},{once:true});addEventListener('keydown',()=>{if(!audioStarted)startMusic()},{once:true});
function pointerPosition(event){let r=c.getBoundingClientRect();mouseX=event.clientX-r.left;mouseY=event.clientY-r.top}
c.addEventListener('pointerdown',event=>{pointerPosition(event);dragged=n.reduce((closest,node)=>Math.hypot(node.x-mouseX,node.y-mouseY)<Math.hypot(closest.x-mouseX,closest.y-mouseY)?node:closest,n[0]);if(Math.hypot(dragged.x-mouseX,dragged.y-mouseY)<48){c.setPointerCapture(event.pointerId);dragged.dragOffsetX=dragged.x-mouseX;dragged.dragOffsetY=dragged.y-mouseY}else dragged=null});
c.addEventListener('pointermove',event=>{pointerPosition(event);if(dragged){dragged.x=mouseX+dragged.dragOffsetX;dragged.y=mouseY+dragged.dragOffsetY;dragged.vx=0;dragged.vy=0}});
c.addEventListener('pointerup',event=>{if(dragged){dragged.vx=(Math.random()-.5)*1.4;dragged.vy=(Math.random()-.5)*1.4}dragged=null;c.releasePointerCapture?.(event.pointerId)});
function rs(){let r=c.getBoundingClientRect(),d=1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);if(!n.length)for(let i=0;i<12;i++)n.push({x:Math.random()*r.width,y:Math.random()*r.height,vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,r:i%5?.75+Math.random()*1.25:2.5+Math.random()*3,h:i==3});if(!e.length)e=[[0,1]]}
function go(now=0){requestAnimationFrame(go);if(now-lastFrame<16)return;lastFrame=now;let w=c.clientWidth,h=c.clientHeight;t+=.08;x.fillStyle='#05080d';x.fillRect(0,0,w,h);if(t-lastAdd>3&&e.length<4){let a=Math.random()*n.length|0,b=Math.random()*n.length|0;if(a!==b)e.push([a,b]);lastAdd=t}n.forEach(a=>{if(a!==dragged){a.x+=a.vx+Math.sin(t+a.y*.01)*.1;a.y+=a.vy+Math.cos(t+a.x*.01)*.1}if(a.x<a.r||a.x>w-a.r)a.vx*=-1;if(a.y<a.r||a.y>h-a.r)a.vy*=-1});e.forEach((q,i)=>{let a=n[q[0]],z=n[q[1]];x.strokeStyle='#b8c6d433';x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(z.x,z.y);x.stroke();let p=(Math.sin(t+i)+1)/2;x.fillStyle='#ff5a1855';x.beginPath();x.arc(a.x+(z.x-a.x)*p,a.y+(z.y-a.y)*p,.7,0,7);x.fill()});n.forEach(a=>{let pulse=a.r+(a.h?Math.sin(t*2)*.375:Math.sin(t*2+a.x)*.0625);x.shadowBlur=a.h?4:1;x.shadowColor=a.h?'#ff4d0a':'#dbe8ff';x.fillStyle=a.h?'#ff4d0a':'#edf2f8';x.beginPath();x.arc(a.x,a.y,Math.max(.25,pulse),0,7);x.fill()})}
addEventListener('resize',rs);rs();go();
</script>
</html>
